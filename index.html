<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Developer Portfolio Lab - Modern web engineering showcase built with Vue 3, TypeScript and Supabase. Online resume, project portfolio, frontend lab and admin CMS." />
    <title>Developer Portfolio Lab</title>
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Developer Portfolio Lab" />
    <meta property="og:description" content="Modern developer platform: online resume, project portfolio, frontend lab and admin CMS. Vue 3 + TypeScript + Supabase." />
    <meta property="og:url" content="https://developer-portfolio-lab.vercel.app/" />
    <meta property="og:image" content="https://developer-portfolio-lab.vercel.app/og-image.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Developer Portfolio Lab" />
    <meta name="twitter:description" content="Modern developer platform: online resume, project portfolio, frontend lab and admin CMS." />
    <script>
      // Prevent FOUC - apply theme before page renders
      (function() {
        const mode = localStorage.getItem('theme-mode') || 'system'
        const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches
        const isDark = mode === 'dark' || (mode === 'system' && prefersDark)
        if (isDark) document.documentElement.classList.add('dark')
      })()
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
